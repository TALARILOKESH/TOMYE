<!DOCTYPE html>
<html>
<head>

    <title>Tomato Sorting System</title>

    <link rel="stylesheet" href="style.css">

    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

</head>

<body>

    <h1>🍅 Tomato Sorting System</h1>

    <!-- Upload Image -->
    <input type="file" id="imageInput" accept="image/*">

    <button onclick="processImage()">Analyze</button>

    <br><br>

    <!-- Uploaded Image Preview -->
    <img id="preview" width="300">

    <br><br>

    <!-- Detection Status -->
    <h3 id="result"></h3>

    <!-- Processed Image with Bounding Boxes -->
    <img id="resultImage" width="500" style="margin-top:20px;">
    <img id="resultImage" width="500" style="display:none;">

    <br><br>

    <!-- Classification Result -->
    <h3 id="classificationResult"></h3>

    <!-- Script -->
    <script src="script.js"></script>

</body>
</html>
